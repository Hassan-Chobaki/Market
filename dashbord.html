<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <link rel="stylesheet" href="/admin/styleAdmin.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            width: calc(100% - 151px);
            height: 500px;
            border-right: 3px solid rgb(195, 228, 195);
            border-top: 3px solid black;
            margin-right:150px;
        }

        .menu{
            background-color: rgb(92, 91, 91);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            right: 0;
            position: absolute;
            
            gap:20px;
            font-size: medium;      
            font-family: var(--font-family);
            font-weight:bold;
            text-align: center;
            color: rgb(0, 0, 0);
            
        }
        .menu>div{width: 100%;height: auto;padding: 40px 25px  ;background-color: rgba(183, 183, 184, 0.501);border-radius: 15px;}
        .menu >div:hover{            
            border-radius: 11px;
            background-color: rgb(201, 201, 201);
            cursor: pointer;color:white;
        }

        .cart{width: 500px;height: 500px;background-color: red;
                margin: 100px;
                }
         .cardProduct{
            box-sizing: border-box;
            width:100%;
            height: 100%;
            background-color: white;
            flex-direction: row;
            justify-content: center;
            align-items: center;   
            display: flex;      
         }       
         .cardOrder{display:none;}
         .btnNewProduct{
            position: fixed;
            right: calc(151px + 10px);
            top: 105px;
            padding: 10px 5px;
            font-family: var(--font-family);
            margin: 2px;
            border-radius: 15px;
            border: 1 solid white;
            background-color: rgb(17, 122, 251);
            color: white;
         }
         .cardNewProduct{            
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;                       
            padding:20px;            
            font-size: larger;
            box-shadow:var(--shadow3);
            border: 1px solid lightgray;
            border-radius: 30px;    
            max-height: 100%;       
            max-width: 100%;
            height: 90%;

        }
        .cardNewProduct>div>div{
            display: flex;
            flex-direction: column;
            gap: 10px;
            
        }
        .cardNewProduct>div>div>input,button,select{
            font-family: var(--font-family);            
            font-size: 14px;
            border-radius: 8px;
            border: 2px solid lightgray;
            padding: 10px;          
            
        }

        button{cursor: pointer;}

        .btnAddProduct{
            background-color: hsl(220, 73%, 88%);
            color: black;
            padding: 10px 20px;
            
        }

       .btn2:hover, .btnAddProduct:hover{box-shadow: var(--shadow3);}
        .btn2:active,.btnAddProduct:active{scale: .9;}

        .divAddBtnBack{
            display: flex;
            flex-direction: row !important;
            justify-content: space-between;
            margin: 20px;
        }


        
        .btnAddPic{
            padding:50px;
            margin: 100px;}
            .imgGray{
                display: inline-block;
                transform: scale(2);
                filter: grayscale(100%);
            }
            .imgGray:hover{filter: brightness(.5);}
            .imgGray:active{filter: brightness(.8);scale: .9;}
            #divAddPic{
                display:flex;
                flex-direction: row;
                width: 100%;
                height: 150px;
                flex-wrap: wrap;
                gap: 5px;
                box-sizing: border-box;
                overflow-x: hidden;      

                 border: 1px solid rgba(141, 139, 139, 0.268);
                border-radius: 15px;
                
            }
            .preview{ 
                width: 100px;
                height: 100px;
                object-fit: contain;
                border: 1px solid rgba(208, 208, 208, 0.268);
                border-radius: 15px;
                background-color:lightgray;
                box-shadow: var(--shadow1);

            }
            .divPicAndName{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-size: 10px;
            }
            .btnDelPic{
                border-radius: 50%;
                overflow: hidden;              
                color: red;
                height:20px;
                width:20px;
                padding: 0;
                font-weight: bold;
            }

            .btnDelPic:hover{font-weight: bolder;scale: .95;}
            .btnDelPic:active{scale: .9;}

            .btn2{
                background: none;
            }

        


    </style>
</head>
<body style="font-family: var(--font-family);">
    <header>
        <h1>Dashboard Mangement</h1>
    </header>


    <div>
        <div class="menu">
            <div id="btnProduct" class="products" ><span >محصولات</span>  </div>
            <div id="btnOrder" class="orders"> <span>سفارشات</span> </div>
            <div id="btnCustomer" class="customers"> <span>مشتریان</span> </div>            
            <div id="btnAnaliz" class="analiz"> <span>آنالیز</span> </div>
        </div>        


<div class="container">

            <div class="cardProduct">
                <button class="btnNewProduct" id="btnNewProduct" type="button">+   محصول جدید</button>
                <form id="cardNewProduct" class="cardNewProduct">
                    <div>
                        <div>
                            <input id="inpCodeProduct" type="text" placeholder="کدمحصول" >
                            <input id="inpNameProduct" type="text" placeholder="نام محصول">
                            <input id="inpPriceProduct" type="text" placeholder="قیمت محصول">
                            <input id="inpQuantityProduct" type="text" placeholder="تعدادموجودی">
                            <div>
                                <label style="font-size:small;color:gray">وضعیت محصول</label>
                                    <select id="inpStatusProduct">
                                        <option value="active">فعال</option>
                                        <option value="inactive">غیرفعال</option>
                                        <option value="ouy_of_stock">ناموجود</option>
                                        <option value="coming_soon">به زودی</option>
                                        <option value="discontinued">متوقف شده</option>
                                    </select>
                            </div>
                        </div> 

                        <div class="divAddBtnBack">
                            <div><button id="btnAddProduct" class="btnAddProduct" type="submit">افزودن</button></div>
                            <div><button id="btnBackProduct" class="btn2" type="button" aria-current="">بازگشت</button></div>
                        </div>
                    </div>
                    <div>
                        <input id="inpAddPic" type="file" name="images" accept="image/*" hidden>
                        <button class="btnAddPic" id="btnAddPic" type="button"><span class="imgGray">+🖼️</span></button>
                        <div id="divAddPic"></div>
                    </div>
                </form>

            </div>




            <div class="cartOrder">

            </div>

</div>  
    

    

</body>
<script src="/admin/dashbordApi.js"></script>
<script src="/admin/dashbord.js"></script>

</html>
