<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <script type="module" src="/public/js/main.js"></script>
    <link rel="stylesheet" href="/public/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیگیری</title>
    <style>
    
    * {box-sizing: border-box;}

        body,main,input,button{font-family: var(--font-family);}

    input{        
        border-radius: 5px;
        border: 1px solid var(--black);
        font-family: var(--font-family);
        font-size: var(--size2Text);       
        height: 36px;
        box-sizing: border-box;
    }
    button{
        background-color: var(--black);
        color: var(--white);
        font-family: var(--font-family);
        padding: 10px;
        border-radius: 15px;
    
    }

    .lblSearch {
        font-weight: bolder;
        font-size: var(--size2Text);
        padding: 10px;
    }
    .main{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .search{ 
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        width: 95dvw;        
        box-sizing: border-box;
        gap: 10px;
    
    }
.search{width: fit-content;background-color: #00000024;border: 1px solid #00000033;padding: 10px;margin: 20px;
border-radius: 10px;box-sizing: border-box;}




#showError{color: red;font-size: 12px;}




.list{display: grid;
    border-radius: 10px;
    border: 1px solid #0000003d;
    background-color: #00000002;   
     place-items: center;
}
.dl{
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 7px;
    

}

.dl dt{
    font-weight: bold;
    font-size: 12px;
    color: #00000050;
}
.dl dd{
    
    font-size: 12px;    
    box-sizing: border-box;
    
}
.btnCancel{
    border: 1px solid red;
    color: red;
    border-radius: 15px;
    width: max-content;
    margin: 10px; 
}

.support{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
}
.sup{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 44px;
    border: 1px solid black;
    text-decoration: none;    
    border-radius: 10px;
    color: white;
    background-color: black;
    white-space: nowrap;
}

.iconTel, .iconApp{
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.iconTel svg, .iconApp svg{
    display: block;
    width: 24px;
    height: 24px;
}

.sup{width:250px;}
.titr{display: flex;flex-direction: column;justify-content: right;align-items:start;font-size: 12px;text-align: right;width: 250px;direction: rtl;}
body{margin: 0;}

.main{min-height: 100dvh;}

.support{
    margin-top: auto;
    padding: 12px 0 20px;
}

.stepper{
  
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    
    font-size:10px;
}
.stepper label{position: relative;min-width: fit-content;white-space: nowrap;color: black;font-size: 10px;font-weight: normal;}

.done{font-weight: normal;color: #4db129;border:2px solid #4db129;border-radius: 10px;}

.col{border: 1px dotted green;border-radius: 15px;background-color: #00800034;font-size: 14px;font-weight: bold;color: #4db129;}
.currentStepp::before{
    position:absolute;
    top: -12px;
    left: 50%;
    color: #4db129;
    content:'✓';
    font-size: 12px;
    font-weight: bold;    
    
}
.line{width: 50px;border-bottom: 2px dashed #00000040;}

.aBack{background-color: black;color: white;padding: 5px;padding: 5px 20px 5px 20px;font-size: 14px;text-decoration: none;
         position: fixed;right:20px;top:10px;cursor: pointer;  }

/***********************************************************        MOBILE*/

@media (max-width:600px) {
    .search{         
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 95dvw;        
        box-sizing: border-box;
        gap: 10px;
    
    }
    input,button{width: 90dvw;font-size: 16px;}
    .titr{width: 95dvw;}
    .sup{width: 90dvw;}
    .list{padding: 10px;}
    
    .towButtom{display: flex;flex-direction: row;width: 90dvw;gap: 5px;}
    .towButtom button{flex: 2;width: auto;}
    .towButtom .aBack{display: flex;justify-content: center;align-items: center;position: static;flex: 1;width: auto;
                        border-radius: 15px;text-align: center;font-size: 15px;}

    
}



    </style>
</head>
