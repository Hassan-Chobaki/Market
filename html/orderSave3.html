<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="/public/js/main.js"></script>
    <link rel="stylesheet" href="/public/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <title>ثبت سفارش</title>

    <noscript><style>#pageLoader { display: none; }</style></noscript>

<style>

/* ============================================================
   طراحی تازه صفحه ثبت سفارش
   همه نام‌ها (شناسه و کلاس) مثل قبل است؛ فقط ظاهر عوض شده
   رنگ اصلی از متغیر colorGreen خودت می‌آید و در یک جا قابل تغییر است
   ============================================================ */
:root {
    --o-accent: var(--colorGreen, #517761);
    --o-accent-dark: #3f6050;
    --o-accent-soft: #edf3ee;
    --o-page: #f4f3f1;
    --o-surface: #ffffff;
    --o-ink: #1f2322;
    --o-muted: #6c7270;
    --o-line: #e4e2de;
    --o-danger: #b42318;
    --o-danger-soft: #fff3f2;
    --o-radius: 16px;
    --o-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
}

/* ---------- پایه ---------- */
body {
    margin: 0;
    background: var(--o-page);
    color: var(--o-ink);
    font-family: var(--font-family);
    line-height: 1.6;
}

img { width: 40px; height: 40px; }

label {
    font-weight: 600;
    font-size: var(--size2Text);
    color: var(--o-ink);
    padding-inline: 0;
}

input:not([type='radio']), select {
    width: 100%;
    height: 44px;
    box-sizing: border-box;
    padding: 0 12px;
    border: 1px solid var(--o-line);
    border-radius: 10px;
    background: #fff;
    color: var(--o-ink);
    font-family: var(--font-family);
    font-size: 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
}

input::placeholder { color: #a3a8a6; }

input:not([type='radio']):focus, select:focus {
    outline: none;
    border-color: var(--o-accent);
    box-shadow: 0 0 0 3px rgba(81,119,97,.18);
}

button {
    height: 46px;
    border: 0;
    border-radius: 12px;
    background: var(--o-ink);
    color: #fff;
    font-family: var(--font-family);
    cursor: pointer;
    transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease;
}

button:active { transform: scale(.98); }


/* ---------- سربرگ ---------- */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 20px 6px;
    box-sizing: border-box;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.2px;
}

.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: auto;
    padding: 7px 18px;
    border: 1px solid var(--o-line);
    border-radius: 999px;
    background: var(--o-surface);
    color: var(--o-ink);
    font-size: 13px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
}

.back:hover { border-color: var(--o-accent); background: var(--o-accent-soft); }


/* ---------- چیدمان کلی ---------- */
.container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 20px 40px;
    box-sizing: border-box;
    background: transparent;
}

.form { flex: 1 1 0; min-width: 0; }

.factor {
    flex: 0 0 360px;
    min-width: 0;
    position: sticky;
    top: 16px;
    padding: 18px;
    box-sizing: border-box;
    background: var(--o-surface);
    border: 1px solid var(--o-line);
    border-radius: var(--o-radius);
    box-shadow: var(--o-shadow);
}

/* عنوان بخش‌ها */
.form > label, .factor > label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 17px;
    font-weight: 800;
}

.form > label::before, .factor > label::before {
    content: '';
    width: 4px;
    height: 18px;
    border-radius: 4px;
    background: var(--o-accent);
}

.order-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
}

.left-stack, .right-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
}

.right-stack { position: relative; }


/* ---------- کارت‌ها ---------- */
.info-panel, .delivery {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    min-width: 0;
    padding: 18px;
    box-sizing: border-box;
    background: var(--o-surface);
    border: 1px solid var(--o-line);
    border-radius: var(--o-radius);
    box-shadow: var(--o-shadow);
}

.divSender .info-row,
.divReciver .info-row,
.divAddress .info-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
}

.divSender .info-row label,
.divReciver .info-row label,
.divAddress .info-row label {
    color: #444a48;
    font-weight: 600;
    white-space: normal;
}

.divSender .info-row input,
.divReciver .info-row input,
.divAddress .info-row input {
    width: 100%;
    max-width: 100%;
    min-width: 0;
}


/* ---------- آکاردئون ---------- */
.panelForMobile {
    background: var(--o-surface);
    border: 1px solid var(--o-line);
    border-radius: var(--o-radius);
    box-shadow: var(--o-shadow);
    overflow: hidden;
    box-sizing: border-box;
}

.panelForMobile > label {
    display: flex !important;
    align-items: center;
    gap: 8px;
    width: 100% !important;
    box-sizing: border-box;
    padding: 15px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: background-color .15s ease;
}

.panelForMobile > label:hover { background: #faf9f8; }
.panelForMobile > label:focus-visible { outline: 2px solid var(--o-accent); outline-offset: -2px; }

/* برچسب «اختیاری» کنار عنوان */
.panelForMobile > label span {
    font-size: 11px !important;
    font-weight: 600;
    color: var(--o-muted);
    background: var(--o-page);
    padding: 1px 9px;
    border-radius: 999px;
}

.panelForMobile > label::after {
    content: '';
    flex: 0 0 auto;
    margin-inline-start: auto;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--o-muted);
    border-bottom: 2px solid var(--o-muted);
    transform: translateY(-2px) rotate(45deg);
    transition: transform .3s ease, border-color .15s ease;
}

.panelForMobile.open > label::after {
    transform: translateY(2px) rotate(-135deg);
    border-color: var(--o-accent);
}

.panelForMobile .info-panel {
    margin: 0;
    padding: 0 18px;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
    overflow: hidden;
    transition: height .3s ease, padding .3s ease;
}

.panelForMobile:not(.open) .info-panel {
    height: 0 !important;
    min-height: 0 !important;
    max-height: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
}

.panelForMobile.open .info-panel { padding: 8px 18px; }


/* ---------- اطلاعات تحویل ---------- */
.delivery > label {
    font-size: 15px;
    font-weight: 800;
}

.divTD {
    display: flex;
    flex-direction: row;
    gap: 10px;
    min-width: 0;
    box-sizing: border-box;
}

/* تاریخ: عنوان و دکمه فردا بالا، سه انتخاب پایین */
.divTD.date-selection {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: end;
    overflow: visible;
}

.divTD.date-selection > label { grid-column: 1 / 3; order: -2; align-self: center; }
.divTD.date-selection > .forTom { grid-column: 3; order: -1; }

.delivery-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    width: auto;
    text-align: start;
}

.delivery-row label { color: var(--o-muted); font-weight: 500; }

/* ساعت: عنوان بالا، دو ساعت کنار هم */
.divTD:has(#inpTimeOf) {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.divTD:has(#inpTimeOf) > label { grid-column: 1 / -1; }

/* دکمه‌های کوچک «فردا» و «مناسبت» */
.forTom, .forOcc {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 0 14px;
    box-sizing: border-box;
    border: 1px solid var(--o-accent);
    border-radius: 999px;
    background: var(--o-accent-soft);
    color: var(--o-accent-dark);
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
}

.forTom label, .forOcc label {
    margin: 0;
    color: inherit;
    cursor: pointer;
    white-space: nowrap;
}

.forTom:hover, .forOcc:hover { background: var(--o-accent); color: #fff; }
.forTom:active, .forOcc:active { scale: .96; }

.tommorrow {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin: 0;
    color: var(--o-ink);
}

.occationDay {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
    color: var(--o-accent-dark);
    text-shadow: none;
}

.selectOcc { display: none; position: relative; z-index: 3; }

.divTD.city, .divTD.address {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
}

.divTD.address label, .divTD.city label { display: block; width: auto; }

.divTD.address input, .divTD.city input { width: 100%; min-width: 0; }

.LBaddressBTmap {
    display: flex;
    flex-direction: row !important;
    justify-content: space-between !important;
    align-items: center !important;
    width: 100%;
    height: auto;
}

#findOnMap {
    min-width: max-content;
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--o-accent);
    border-radius: 999px;
    background: var(--o-accent-soft);
    color: var(--o-accent-dark);
    font-size: 12px;
    font-weight: 700;
}

#findOnMap:hover { background: var(--o-accent); color: #fff; }

.addressComment {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
}

/* فهرست مناسبت‌ها که روی کارت تحویل باز می‌شود */
#dark, .dark {
    all: initial;
    font-family: var(--font-family);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-sizing: border-box;
    position: absolute;
    top: 150px;
    left: 14px;
    right: 14px;
    max-height: 60%;
    overflow-y: auto;
    padding: 10px;
    background: var(--o-surface);
    border: 1px solid var(--o-line);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.18);
    z-index: 2;
}

#dark:empty, .dark:empty { padding: 0; border: 0; box-shadow: none; background: transparent; }

.occasionRow {
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 42px;
    padding: 0 14px;
    box-sizing: border-box;
    width: 100%;
    border: 1px solid var(--o-line);
    border-radius: 10px;
    background: #fff;
    color: var(--o-ink);
    font-size: 13px;
    cursor: pointer;
    box-shadow: none;
    transition: background-color .15s ease, border-color .15s ease;
}

.occasionRow:hover, .occasionRow:active {
    background: var(--o-accent-soft);
    border-color: var(--o-accent);
    scale: 1;
}


/* ---------- دکمه ثبت سفارش و پیام‌های خطا ---------- */
.divBtn {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-top: 2px;
    color: #fff;
}

.divBtn > div {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    min-width: 0;
}

#btnSaveOrder {
    position: relative;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 100%;
    height: 54px;
    padding: 0 24px;
    border-radius: 14px;
    background: var(--o-accent);
    color: #fff;
    font-weight: 800;
    font-size: var(--size3Text);
    box-shadow: 0 8px 20px rgba(81,119,97,.32);
}

#btnSaveOrder:hover { background: var(--o-accent-dark); }

.msgError, .dateError {
    box-sizing: border-box;
    padding: 11px 16px;
    border: 1px solid #f3c5c0;
    border-radius: 12px;
    background: var(--o-danger-soft);
    color: var(--o-danger);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    white-space: normal;
    overflow-wrap: anywhere;
}

.msgError {
    display: none;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 100%;
}

.dateError {
    /* عرض ذاتی جمله در محاسبه عرض فرم دخالت نکند؛ عنصر فقط به اندازه والد پهن شود و جمله بشکند */
    width: 0;
    min-width: 100%;
    max-width: 100%;
    contain: inline-size;
    line-height: 1.9;
}

.dateError a { color: inherit; text-decoration: underline; font-weight: 800; }

.classError::placeholder { color: var(--o-danger); }
.classError { border: 1px solid var(--o-danger) !important; background: var(--o-danger-soft) !important; }
.classCorrect { border: 1px solid var(--o-accent); }


/* ---------- فاکتور خرید ---------- */
.listOrder {
    display: grid;
    grid-template-columns: 1.7fr .55fr 1.15fr 1.25fr 36px;
    gap: 6px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    margin: 0;
    padding: 10px 6px;
    border-bottom: 1px solid var(--o-line);
    border-radius: 0;
    background: transparent;
    color: var(--o-ink);
    font-size: 12px;
    overflow: hidden;
}

.listOrder > * { min-width: 0; text-align: center; overflow-wrap: anywhere; }
.listOrder > :first-child { text-align: start; }
.listOrder > :nth-child(n+2):nth-child(-n+4) { white-space: nowrap; overflow-wrap: normal; }

.listOrder.titr {
    margin-bottom: 4px;
    padding: 9px 6px;
    border: 0;
    border-radius: 10px;
    background: var(--o-page);
    color: var(--o-muted);
    font-size: 11.5px;
    font-weight: 700;
}

.listOrder img {
    width: 36px;
    height: 36px;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    justify-self: center;
    cursor: zoom-in;
}

.totalPrice {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--o-accent-soft);
    color: var(--o-accent-dark);
    font-size: 15px;
    font-weight: 800;
}


/* ---------- روش‌های پرداخت ---------- */
.payment-methods * {
    display: flex;
    flex-direction: row;
    color: var(--o-ink);
    background-color: transparent;
    padding: 2px;
}

.payment-option { border-bottom: 1px solid var(--o-line); }


/* ---------- بزرگ‌نمایی تصویر، نقشه و راهنمای شناور ---------- */
.zoom {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(17,20,19,.72);
    backdrop-filter: blur(3px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
}

.imgBig {
    max-width: 90%;
    min-width: 0;
    width: auto;
    height: auto;
    max-height: 90%;
    min-height: 0;
    object-fit: contain;
    border-radius: 14px;
    box-sizing: border-box;
}

.centerBox {
    display: flex;
    flex-direction: row;
    width: 20%;
    height: 20%;
    border: 50px dashed var(--shadowWhite);
    justify-content: center;
    align-items: center;
    color: red;
    background-color: white;
    box-shadow: var(--shadowWhite);
    text-align: center;
    gap: 10px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

.centerBox.mapBox {
    position: relative;
    width: min(92vw, 760px);
    height: min(82vh, 580px);
    border: 0;
    border-radius: 18px;
    padding: 0;
    overflow: hidden;
    box-sizing: border-box;
    color: inherit;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
}

.mapBox #map { width: 100%; height: 100%; }

.mapClose {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    background: #fff;
    color: var(--o-ink);
    font-size: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
}

.mapClose::before { content: '✕'; }

.thisPosition {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: 62%;
    max-width: 300px;
    height: 48px;
    border-radius: 999px;
    background: var(--o-accent);
    font-weight: 800;
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
}

.thisPosition:active { transform: translateX(-50%) scale(.98); }

.toltip {
    position: absolute;
    background-color: var(--o-ink);
    color: #fff;
    width: max-content;
    height: auto;
    padding: 4px 10px;
    border-radius: 8px;
    margin-inline-end: 10px;
    font-size: 12px;
    font-weight: normal;
    box-shadow: var(--shadowD);
}


/* ============================================================
   تبلت و موبایل
   ============================================================ */
@media (max-width: 900px) {

    header, .container { padding-inline: 14px; }

    .container {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
    }

    .factor { flex: none; position: static; width: 100%; }

    .order-form { grid-template-columns: minmax(0, 1fr); gap: 14px; }

    .left-stack, .right-stack { width: 100%; max-width: 100%; gap: 14px; }
}


@media (max-width: 600px) {

    input:not([type='radio']), select { font-size: 16px; }   /* جلوگیری از بزرگ‌نمایی خودکار در گوشی */

    .info-panel, .delivery { padding: 16px; }

    .listOrder { grid-template-columns: 1.8fr .6fr 1fr 1.1fr 32px; padding: 9px 2px; font-size: 11.5px; }

    .factorImg { width: 30px !important; height: 30px; border: 0 !important; }

    .centerBox.mapBox { width: 100dvw !important; height: 100dvh !important; border-radius: 0; }
}

</style>

</head>
<body>

    <div id="pageLoader"></div>

    <header>
        <h1>ثبت سفارش</h1>
        <div>
            <span class="back" data-i18n="back" onclick="location.href='index.html'"></span>
        </div>
    </header>


    <div class="container">

        <div class="form">
            <label>فرم ثبت سفارش</label>

            <form class="order-form">

                <div class="left-stack">

                    <div class="info-panel divSender">
                        <div class="info-row"><label data-i18n="nameFamily"></label><input id="inpNameFamilySen" type="text"></div>
                        <div class="info-row"><label data-i18n="mobileSender"></label><input id="inpMobileSender" type="tel" maxlength="11" minlength="11"></div>
                        <div class="info-row"><label data-i18n="nameReciver"></label><input id="inpNameFamilyRec" type="text"></div>
                    </div>


                    <div class="panelForMobile">
                        <label id="titlePanelRec" data-i18n="EtcInfoReciver"><span style="font-size: 5px;" data-i18n="optional"></span> </label>
                        <div class="info-panel divReciver">
                            <div class="info-row tel"><label data-i18n="phoneSender"></label><input id="inpTelSender" type="tel" data-i18n="optional"></div>
                            <div class="info-row"><label data-i18n="mobileReciver"></label><input id="inpMobileReciver" type="tel" maxlength="11" minlength="11" data-i18n="optional"></div>
                            <div class="info-row tel"><label data-i18n="phoneReciver"></label><input id="inpTelReciver" type="tel" data-i18n="optional"></div>
                        </div>
                    </div>


                    <div id="panelNoteComment" class="panelForMobile">
                        <label id="titlePanelNoteComment" data-i18n="cart"></label>
                        <div class="info-panel divAddress">
                            <div class="info-row note-comment"><label data-i18n="note"></label><input id="inpNote" type="text" data-i18n="placeHolderNote"></div>
                            <div class="info-row address"><label data-i18n="comment"></label><input id="inpComment" type="text" data-i18n="optional"></div>
                        </div>
                    </div>

                </div>


                <div class="right-stack" id="right-stack">

                    <div id="delivery" class="delivery">
                        <div id="dark" class="dark"></div>

                        <label data-i18n="deliveryInfo"></label>

                        <div class="divTD date-selection">

<script>
/* پایان بارگذاری: وقتی همه فایل‌ها آمدند و اسکریپت صفحه هم آماده شد (حداکثر ۱٫۵ ثانیه صبر)، صفحه نمایش داده می‌شود */
(function () {
    var loader = document.getElementById('pageLoader');
    var loaded = document.readyState === 'complete';
    var ready = window.orderPageReady === true;

    function done() {
        if (!loader) return;
        var el = loader;
        loader = null;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 350);
    }

    function check() { if (loaded && ready) done(); }

    window.addEventListener('load', function () {
        loaded = true;
        check();
        setTimeout(done, 1500);
    });
    window.addEventListener('orderPageReady', function () { ready = true; check(); });
    check();

    setTimeout(done, 10000); /* اگر چیزی گیر کرد، صفحه برای همیشه پنهان نماند */
})();

/* آکاردئون دو بخش گیرنده و یادداشت؛ در همه اندازه‌ها یکسان است.
   حالت باز و بسته را کلاس open روی خود کادر (panelForMobile) نگه می‌دارد */
(function () {
    var ids = ['titlePanelRec', 'titlePanelNoteComment'];

    function parts(label) {
        var box = label.parentElement;
        return { box: box, panel: box.querySelector('.info-panel') };
    }

    function open(label) {
        var p = parts(label);
        p.panel.inert = false;
        p.panel.style.height = (p.panel.scrollHeight + 16) + 'px';
        p.box.classList.add('open');
        p.panel.classList.add('open');
        label.setAttribute('aria-expanded', 'true');
        p.panel.addEventListener('transitionend', function end(e) {
            if (e.propertyName !== 'height') return;
            p.panel.removeEventListener('transitionend', end);
            if (p.box.classList.contains('open')) p.panel.style.height = 'auto';
        });
    }

    function close(label) {
        var p = parts(label);
        p.panel.style.height = p.panel.offsetHeight + 'px';
        void p.panel.offsetHeight;
        p.box.classList.remove('open');
        p.panel.classList.remove('open');
        p.panel.style.height = '0px';
        p.panel.inert = true;
        label.setAttribute('aria-expanded', 'false');
    }

    function toggle(label) {
        var p = parts(label);
        if (!p.panel) return;
        if (p.box.classList.contains('open')) close(label);
        else open(label);
    }

    ids.forEach(function (id) {
        var label = document.getElementById(id);
        if (!label) return;
        var p = parts(label);
        label.setAttribute('role', 'button');
        label.setAttribute('tabindex', '0');
        label.setAttribute('aria-expanded', 'false');
        if (p.panel) p.panel.inert = true;
    });

    /* مرحله گرفتن رویداد: قاعده قدیمی اسکریپت پروژه (فقط موبایل) اجرا نمی‌شود تا دوبار باز و بسته نشود */
    document.addEventListener('click', function (e) {
        var label = e.target.closest('#titlePanelRec, #titlePanelNoteComment');
        if (!label) return;
        e.stopPropagation();
        toggle(label);
    }, true);

    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var label = e.target.closest && e.target.closest('#titlePanelRec, #titlePanelNoteComment');
        if (!label) return;
        e.preventDefault();
        toggle(label);
    });
})();
</script>
