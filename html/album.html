<!DOCTYPE html>
<html>
<head>
    <script type="module" src="/public/js/main.js"></script>
    
    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="album"></title>


    <style>

     body,input,button{
            background-color: var(--background1Black);
            font-family: var(--font-family);
        
        }
    #detailName{font-weight: var(--bold);}
   #detailCode,#detailPrice{font-size: var(--size2Text)}     




            .selectImage{               
                padding:0 0 0 0;
                width: 500px;
                height: 500px;
                object-fit: cover;
                border: 1px solid var(--colorGreen);
            }



            .tab{
                display: flex;
                justify-content: center;              
                text-align: center;
                width: 150px;                
                background-color: var(--background2Black);
                font-family:var(--font-family);
                color: var(--color1TextWhite);
                justify-content: center;
                gap: 20px;
            }

            .container{
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 5px;
                margin-top: 20px;
                
            }


           span, .btGo{
                cursor: pointer;
                font-size: var(--size3Text);
            
            }

            .btGo{
                background-color: var(--background2Black);
                color: var(--color1TextWhite);
                border: none;
                padding: 10px 20px;
                border-radius: 36px;
                font-family: var(--font-family);
                height: 50px;
                margin: 20px;

            }

            .btGo:hover{
                scale: .97;
            }

            .btGo:active{
                background-color: var(--background4Gray);
                color: var(--color2TextBlack);
            }



            .imgLeft,.imgRight{
                width: 100px;height: 100px;border: 3px solid var(--background2Black);filter: blur(2px);margin: 10px;object-fit: cover;
            }
            .imgCenter{object-fit: cover;width: 150px;height: 150px;}

            .spansDetail{
                display:flex;flex-direction: column;margin: 5px;justify-content: center;align-items: center;
                border: 1px solid var(--colorGreen);border-radius: 5px;
                padding: 20px;
                background-color: var(--background3LightGray);
            }
            .divDetail{
                 display:inline-flex;flex-direction: row;align-items: center;
                 border: 0px solid var(--colorGreen);border-radius: 5px;
                 
    }


  
img{object-fit: cover;border-radius: 10px;}
.triple{background-color: var(--background3LightGray);border-radius: 20px;border:1px solid var(--colorGreen);align-items: center;}

.incDec {
    border: 1px solid var(--background4Gray);
    text-align: center;
    width: 20px;
    font-weight: bolder;
    font-size: var(--size2Text);
    margin-inline:5px;
    
}



.counterAndFastOrder{display: flex;flex-direction: row;justify-content: space-between;width: 100%;}
.orderOptions{
    display: grid;
    grid-template-columns: max-content;
    width: max-content;
}
.orderOptions > div:first-child{white-space: nowrap;}
.orderOptions > div:last-child{width: 100%;margin-top: 5%;}
.orderOptions > div:last-child span{border-radius: 5px;
    display: block;
    width: 100%;
    text-align: center;
}
.detail{display: flex;flex-direction: row;justify-content: center;align-items: center;}

.container{display: flex;align-items:flex-start;gap: 20px;}

.listOrder *{font-size: var(--size2Text);}
.listOrder {margin: 10px;border-radius: 10px;border: 1px solid var(--colorGreen);background-color: var(--background3LightGray);}
.listOrder >div:nth-child(even){background-color: var(--background5GrayDark) !important;}
.btnListOrder{display: none;}

.incDec{cursor: pointer;}
.btnAdd,.spanOrderThis{display: inline-block;align-self: self-end;color:var(--color1TextWhite);background: var(--background2Black);border-radius: 5px;}
.incDec:active,.btnAdd:active,.spanOrderThis:active,.btnListOrder:active,.orderOptions>div:last-child:active{transform: scale(0.9);}
.titrProductSelect{display: flex;font-weight: bolder;}
.titrProductSelect>span{flex: 1;text-align: center;cursor:unset;}
.selectImage{box-shadow:
    0 5px 10px rgba(0,0,0,0.9),
    0 -5px 10px rgba(0,0,0,0.9);}

    .X{
        background: none;
        border: none;
        cursor: pointer;
    }
    .X:hover{scale:1.1;background: transparent;font-weight: bolder;}
    .X:active{scale: 0.9;}


.messageBox {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    opacity: 0;
    pointer-events: none;

    min-width: 220px;
    max-width: 90%;
    padding: 14px 28px;
    border-radius: 14px;
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    font-size: 15px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(6px);
    z-index: 9999;
}

.messageBox.show {
    animation: messageSlide 7s ease forwards;
}

@keyframes messageSlide {
    0%   { transform: translate(-50%, 100%); opacity: 0; }
    12%  { transform: translate(-50%, -30px); opacity: 1; }
    85%  { transform: translate(-50%, -30px); opacity: 1; }
    100% { transform: translate(-50%, 100%); opacity: 0; }
}




#backFast{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;   /* وسط‌چین افقی */
    align-items:flex-end;     /* چسبیده به پایین */
    
}

.btn{
    background-color: black;
    color:white;
    border-radius: 10px;
    border: none;
    padding: 5px;
    margin: 10px;
}
.btn:active{scale: 0.9;}

.divFastOrder{display: flex;flex-direction: column;justify-content: center;align-items: center;
               background-color: #dedede;padding:40px 10px 5px;
               position: relative;
}

#addressFast{flex:2;font-family: var(--font-family);}
#mapFast{flex:0 0 auto;}
.divElement{display: flex;gap: 10px;flex-direction: column;}
#mapFast{
    flex:1;
    min-width:0;
    white-space:nowrap;
    font-size:13px;
    padding:10px 5px;
    font-size: 10px;
}
input{border: 1px solid gray;border-radius: 5px;background-color: white;color: black;min-height: max-content;padding: 5px;}
/*                                شروع رسپانسو                */

.save{width: 250px;padding: 15px;}
.close{padding:2px 10px; position:absolute; top:8px; right:8px; margin:0;}

.spaceBetween{display: flex;justify-content: space-between;flex-direction: row;align-items: baseline;gap: 20px;direction: rtl;}
#nameProductFast,#priceProductFast{cursor: default;}

.btn:disabled:active{
    opacity: .5;
    scale:1;
}

#map{width: 100%;height:100%;background-color:  darkgrey;
     position: absolute;right: 0;top:0;

}
.towElementMap{display: flex;flex-direction: row;justify-content: space-between;
                position: absolute;bottom: 10px;right: 10px;z-index: 10010;

}

#map{display: none;}



/****************************************************************************************/


#backFast{
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 2000;
}
#backFast.show{
    opacity: 1;
    pointer-events: auto;
}

.divFastOrder{
    border-radius: 5px;
    transform: translateY(100%);
    transition: transform .4s ease;
}
#backFast.show .divFastOrder{
    transform: translateY(0);
}
/****************************************** آکاردیون کارت*/



.timeRow{display: flex; gap: 10px; justify-content: space-between;}
.chips{display:flex; gap:8px; flex-wrap:wrap;margin: 20px 2px 40px;flex-flow: row;}
.chip{cursor:pointer;}
.chip input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}
.chip div>span{
    display:block;
    background:#fff; color:#000;
    border:1px solid #b5b4b4; border-radius:20px;
    padding:8px 14px; font-size:12px;
    font-family:var(--font-family);
    transition:background .2s, color .2s;
}
.chip input:checked + div>span {background:#000; color:#fff; border-color:#000;}
.chip input:checked + div>span::before{
    content:'✓';
    margin-inline-end:6px;
    font-weight:bold;
}
.chip input:focus-visible + div>span{outline:2px solid #000; outline-offset:2px;}
.chip:active div> span{scale:.95;}

.border{border: 1px solid black;padding: 10px;}
.chip small{
    
    font-size:11px;
    color:#999;
    visibility: hidden;
}
.chip input:checked + div small{
    color:#000;
}
/******************************************************************************************/


@media(max-width:650px)  {
#next,#prev{font-size: 0;}
    #next::after{content: '<';font-size: var(--size2Text);font-weight: var(--bold);}
    #prev::after{content: '>';font-size: var(--size2Text);font-weight: var(--bold);}

    html,body{
        justify-content: center;
        box-sizing: border-box;        
        overflow-x: hidden;
        width: 100vw;

    }


    body,.container{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        
        
        
        
    }

    .imgLeft,.imgRight{
        width: 50px;
        height: 50px;
        object-fit: cover;
        
    }
    .imgCenter{
        width: 100px;
        height: 100px;
        object-fit: cover;
    }
    .triple{
        gap: 3px;
        width: 100%;
        
        object-fit: cover;
    }

   
    .divDetail{
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        row-gap: 20px;
    }

    .selectImage{
        display:block !important;
        width: 100vw !important;
        height: 400px;
        max-width: 98%;        
        box-sizing: border-box;
        object-fit: cover;
        
    }

    

    .spansDetail{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: none;
        background-color: var(--background0Trans)!important;
        gap: 2px;
        
    }
    .spanOrderThis::after{

       align-self: center !important;
       margin-bottom: 15px;
       content:attr(data-i18n2="orderFastMOBILE")!important;
        

    }
    .counterAndFastOrder{display: flex;flex-direction: column;justify-content: center;gap: 15px;margin:5px;}
    

.btnListOrder{display: flex;border: 1px solid var(--color2TextBlack);border-radius: 15px;}

.listOrder{
            position: fixed; bottom: 0;width: 90%;max-height: 50vw;left: 50%;
            transform: translate(-50%,100%);
            transition:transform .5s ease ;
            z-index: 1000;
        }

.listOrder.show{transform: translate(-50%,0);}

.orderOptions {all:inherit ;}
.orderOptions>div:last-child{width: 98%;box-sizing: border-box;}

}              <!--پایان رسپانسیو مبایلی-->

    

    






    </style>

</head>
